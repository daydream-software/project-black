name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The org enforces SHA-pinned actions, and GitHub's own upload-pages-artifact
# pulls in a tag-pinned nested action that the policy rejects. So instead of the
# Pages "Actions" pipeline we build here and publish dist/ to the `gh-pages`
# branch with plain git — only checkout + setup-node (both SHA-pinned) are used.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish dist/ to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          touch .nojekyll  # serve _-prefixed files; skip Jekyll processing
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
